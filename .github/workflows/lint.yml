name: lint
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Node uses its built-in CA list, which still trusts the bad roots, and
      # does not read the system bundle that the CA fix steps below fix. This
      # flag makes Node use the file in SSL_CERT_FILE, which those steps set,
      # in place of its built-in list. It is not set on Windows: no step there
      # sets SSL_CERT_FILE, so Node's OpenSSL would read its build-time path,
      # which has no bundle.
      # https://github.com/okTurtles/libcheloniajs/blob/main/.github/actions/fix-ubuntu-ca-roots/action.yml
      # https://github.com/nodejs/node/blob/main/deps/openssl/openssl_common.gypi
      NODE_OPTIONS: ${{ (matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest') && '--use-openssl-ca' || '' }}
    steps:
      - uses: okTurtles/libcheloniajs/.github/actions/fix-ubuntu-ca-roots@main
        if: runner.os == 'Linux'
      # Remove the compromised eMudhra roots (plus the Comodo AAA root that
      # curl's fix also drops) from the runner's preinstalled /etc/ssl/cert.pem
      # before anything makes a TLS request. Inlined rather than used as a
      # composite action so it can run before checkout. Each awk pass drops one
      # named `=== ` block from the bundle; the result is only installed if it
      # is non-empty. The last check fails the job if the bundle still holds
      # one of the roots, for example when the install was skipped. Then the
      # step sets SSL_CERT_FILE, so that Node (see NODE_OPTIONS above) uses
      # the fixed file in the steps after it.
      # https://emudhra.we-have-a-problem.com/#macos-curl
      # https://raw.githubusercontent.com/curl/curl/f0da5390ad9d380807cc83e600196809df8bb96b/.github/actions/macos-fix-certs/action.yml
      - name: Fix macOS runner CA root bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ls -lA /etc/ssl/cert.pem
          t="$(mktemp)" && \
            awk -v s='=== /C=IN/OU=emSign PKI/O=eMudhra Technologies Limited/CN=emSign ECC Root CA - G3' \
              '/^(===|###) /{skip=0} $0==s{skip=1} !skip' /etc/ssl/cert.pem | \
            awk -v s='=== /C=US/OU=emSign PKI/O=eMudhra Inc/CN=emSign ECC Root CA - C3' \
              '/^(===|###) /{skip=0} $0==s{skip=1} !skip' | \
            awk -v s='=== /C=US/OU=emSign PKI/O=eMudhra Inc/CN=emSign Root CA - C1' \
              '/^(===|###) /{skip=0} $0==s{skip=1} !skip' | \
            awk -v s='=== /C=GB/ST=Greater Manchester/L=Salford/O=Comodo CA Limited/CN=AAA Certificate Services' \
              '/^(===|###) /{skip=0} $0==s{skip=1} !skip' > "$t" && \
            [ -s "$t" ] && sudo install -m 0644 -o root -g wheel "$t" /etc/ssl/cert.pem; rm -f "$t"
          ls -lA /etc/ssl/cert.pem
          if openssl crl2pkcs7 -nocrl -certfile /etc/ssl/cert.pem |
               openssl pkcs7 -print_certs -noout |
               grep -E 'emSign ECC Root CA - (G3|C3)|emSign Root CA - C1|AAA Certificate Services'; then
            echo "::error::/etc/ssl/cert.pem still trusts a compromised root"
            exit 1
          fi
          echo "SSL_CERT_FILE=/etc/ssl/cert.pem" >> "$GITHUB_ENV"
      # By default, the GitHub Action on Windows uses `core.autocrlf=true`.
      # LF is converted to CRLF, this produces reports from formatters (gofmt/gofumpt/etc.).
      - run: "git config --global core.autocrlf input"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: --config=.golangci.yml --timeout=10m ./...
          version: v2.13.1
