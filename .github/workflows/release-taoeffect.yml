# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: release-taoeffect

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, such as v1.2.3
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-taoeffect-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - run: git diff --exit-code
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Resolve release version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${DISPATCH_TAG}"
          fi

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${TAG}" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
      - name: Build release archives
        run: |
          set -euo pipefail

          build_archive() {
            local goos="$1"
            local goarch="$2"
            local suffix="$3"
            local archive="crush_${VERSION}_${suffix}"

            mkdir -p "dist/${archive}"
            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 GOEXPERIMENT=greenteagc \
              go build -trimpath \
                -ldflags "-s -w -X github.com/charmbracelet/crush/internal/version.Version=${VERSION}" \
                -o "dist/${archive}/crush" .
            cp README.md LICENSE.md "dist/${archive}/"
            tar -czf "dist/${archive}.tar.gz" -C dist "${archive}"
            rm -rf "dist/${archive}"
          }

          rm -rf dist
          mkdir -p dist
          build_archive linux amd64 Linux_x86_64
          build_archive linux arm64 Linux_arm64
          build_archive darwin amd64 Darwin_x86_64
          build_archive darwin arm64 Darwin_arm64
          sha256sum dist/*.tar.gz > dist/checksums.txt
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.tar.gz dist/checksums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${TAG}" dist/*.tar.gz dist/checksums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG}" \
              --generate-notes
          fi
      - name: Generate npm package
        run: node scripts/generate-npm-package.mjs --version "${VERSION}" --tag "${TAG}" --dist dist --out .release/npm-package
      - name: Check npm package
        working-directory: .release/npm-package
        run: npm pack --dry-run
