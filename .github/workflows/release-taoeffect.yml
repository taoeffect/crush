# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: release-taoeffect

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, such as v1.2.3
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-taoeffect-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - run: git diff --exit-code
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Resolve release version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${DISPATCH_TAG}"
          fi

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${TAG}" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
      - name: Build release archives
        run: |
          set -euo pipefail

          build_archive() {
            local goos="$1"
            local goarch="$2"
            local suffix="$3"
            local archive="crush_${VERSION}_${suffix}"

            mkdir -p "dist/${archive}"
            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 GOEXPERIMENT=greenteagc \
              go build -trimpath \
                -ldflags "-s -w -X github.com/charmbracelet/crush/internal/version.Version=${VERSION}" \
                -o "dist/${archive}/crush" .
            cp README.md LICENSE.md "dist/${archive}/"
            tar -czf "dist/${archive}.tar.gz" -C dist "${archive}"
            rm -rf "dist/${archive}"
          }

          rm -rf dist
          mkdir -p dist
          build_archive linux amd64 Linux_x86_64
          build_archive linux arm64 Linux_arm64
          build_archive darwin amd64 Darwin_x86_64
          build_archive darwin arm64 Darwin_arm64
          sha256sum dist/*.tar.gz > dist/checksums.txt
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          RELEASE_MODEL: ${{ vars.RELEASE_MODEL }}
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { mkdirSync, writeFileSync } from "node:fs";

          const apiKey = process.env.ZAI_API_KEY;
          const model = process.env.RELEASE_MODEL;
          const repo = process.env.GITHUB_REPOSITORY;
          const currentTag = process.env.TAG;

          if (!apiKey) throw new Error("ZAI_API_KEY is required");
          if (!model) throw new Error("RELEASE_MODEL is required");
          if (!repo) throw new Error("GITHUB_REPOSITORY is required");
          if (!currentTag) throw new Error("TAG is required");

          const run = (command, args) => execFileSync(command, args, {
            encoding: "utf8",
            stdio: ["ignore", "pipe", "pipe"],
          }).trim();

          const exists = (ref) => {
            try {
              execFileSync("git", ["rev-parse", "--verify", "--quiet", ref], {
                stdio: "ignore",
              });
              return true;
            } catch {
              return false;
            }
          };

          const isAncestor = (ref) => {
            try {
              execFileSync("git", ["merge-base", "--is-ancestor", ref, currentTag], {
                stdio: "ignore",
              });
              return true;
            } catch {
              return false;
            }
          };

          execFileSync("git", ["fetch", "--force", "--tags"], { stdio: "inherit" });

          let previousTag = "";
          try {
            const releases = JSON.parse(run("gh", [
              "release",
              "list",
              "--repo",
              repo,
              "--exclude-drafts",
              "--limit",
              "100",
              "--json",
              "tagName",
            ]));
            previousTag = releases
              .map((release) => release.tagName)
              .find((tag) => tag !== currentTag && exists(`refs/tags/${tag}`) && isAncestor(tag)) ?? "";
          } catch (error) {
            console.error(`Failed to find previous GitHub release: ${error.message}`);
          }

          if (!previousTag) {
            previousTag = run("git", ["tag", "--merged", currentTag, "--sort=-creatordate", "--list", "v*.*.*"])
              .split("\n")
              .find((tag) => tag && tag !== currentTag) ?? "";
          }

          const range = previousTag ? `${previousTag}..${currentTag}` : currentTag;
          const commitMessages = run("git", ["log", "--format=%B%n---END COMMIT---", range]);
          const previousRelease = previousTag || "the beginning of the repository";

          const response = await fetch("https://api.z.ai/api/coding/paas/v4/chat/completions", {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${apiKey}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              model,
              temperature: 0.2,
              max_tokens: 2000,
              messages: [
                {
                  role: "system",
                  content: "You write concise GitHub release notes from git commit messages. Return only Markdown. Use level 4 headings only for non-empty sections named Features, Improvements, and Bugfixes. Each bullet must be one brief sentence in the form '- Short change - extremely short description'. Mention only important user-visible changes. Omit chores, tests, docs, refactors, and CI unless they materially affect users. Do not include code fences, introductions, conclusions, or empty sections. If there are no important changes, return an empty string.",
                },
                {
                  role: "user",
                  content: `Summarize important changes in ${currentTag} since ${previousRelease}.\n\nCommit messages:\n${commitMessages}`,
                },
              ],
            }),
          });

          if (!response.ok) {
            throw new Error(`Z.ai release notes request failed with ${response.status}: ${await response.text()}`);
          }

          const payload = await response.json();
          const notes = (payload.choices?.[0]?.message?.content ?? "")
            .replace(/^```(?:markdown)?\s*/i, "")
            .replace(/\s*```$/i, "")
            .trim();
          const generatedNote = `Release notes generated by ${model}.`;

          mkdirSync("dist", { recursive: true });
          writeFileSync("dist/release-notes.md", notes ? `${notes}\n\n${generatedNote}\n` : `${generatedNote}\n`);
          NODE
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --notes-file dist/release-notes.md
            gh release upload "${TAG}" dist/*.tar.gz dist/checksums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${TAG}" dist/*.tar.gz dist/checksums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG}" \
              --notes-file dist/release-notes.md
          fi
      - name: Generate npm package
        run: node scripts/generate-npm-package.mjs --version "${VERSION}" --tag "${TAG}" --dist dist --out .release/npm-package
      - name: Check npm package
        working-directory: .release/npm-package
        run: npm pack --dry-run
      - name: Publish npm package
        working-directory: .release/npm-package
        run: npm publish --access public --tag latest
